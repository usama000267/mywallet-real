<!-- =====================================================
     META NFT — PASSWORD SYSTEM UI
===================================================== -->

<div class="password-system">

    <div class="password-system-inner">

        <div class="password-system-header">

            <div class="password-system-icon">
                🔐
            </div>

            <h2 class="password-system-title">
                Change Password
            </h2>

            <p class="password-system-subtitle">
                Secure your Meta NFT account with a new password.
            </p>

        </div>


        <div
            id="passwordSystemMessage"
            class="password-system-message">
        </div>


        <form
            id="changePasswordForm"
            class="password-system-form"
            autocomplete="off"
        >

            <!-- EMAIL -->

            <div class="password-system-field">

                <label
                    class="password-system-label">
                    Registered Email
                </label>

                <div class="password-system-input-wrap">

                    <input
                        type="email"
                        id="passwordSystemEmail"
                        class="password-system-input"
                        placeholder="Your registered email"
                        readonly
                    >

                </div>

            </div>


            <!-- OTP -->

            <div class="password-system-field">

                <label
                    class="password-system-label">
                    Verification Code
                </label>

                <div class="password-system-otp-row">

                    <input
                        type="text"
                        id="passwordSystemOtp"
                        class="password-system-input password-system-otp"
                        placeholder="000000"
                        maxlength="6"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                    >

                    <button
                        type="button"
                        id="passwordSystemGetOtp"
                        class="password-system-otp-button"
                    >
                        GET OTP
                    </button>

                </div>

            </div>


            <!-- NEW PASSWORD -->

            <div class="password-system-field">

                <label
                    class="password-system-label">
                    New Password
                </label>

                <div class="password-system-input-wrap">

                    <input
                        type="password"
                        id="passwordSystemNewPassword"
                        class="password-system-input"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="password-system-eye"
                        data-password-toggle="passwordSystemNewPassword"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>


                <div class="password-system-strength">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>

                <div
                    id="passwordSystemStrengthText"
                    class="password-system-strength-text"
                >
                    Enter a strong password
                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="password-system-field">

                <label
                    class="password-system-label">
                    Confirm Password
                </label>

                <div class="password-system-input-wrap">

                    <input
                        type="password"
                        id="passwordSystemConfirmPassword"
                        class="password-system-input"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="password-system-eye"
                        data-password-toggle="passwordSystemConfirmPassword"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                id="passwordSystemSubmit"
                class="password-system-submit"
            >
                CHANGE PASSWORD
            </button>

        </form>

    </div>

</div>
